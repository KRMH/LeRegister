[project]
name = "leregister"
version = "0.1.0"
description = "LeRegister: Telegram bot that records phone bookings for one owner"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "python-telegram-bot[job-queue]==22.8",
    "APScheduler==3.11.3",
    "phonenumbers==9.0.42",
    "tzdata",
    "httpx>=0.27,<0.29",
]

[project.scripts]
leregister = "leregister.app:main"

[dependency-groups]
dev = [
    "pytest",
    "import-linter==2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leregister"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_package = "leregister"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is pure"
type = "forbidden"
source_modules = ["leregister.core"]
forbidden_modules = [
    "leregister.adapters",
    "leregister.app",
    "leregister.config",
    "telegram",
    "sqlite3",
    "httpx",
    "requests",
    "urllib3",
    "aiohttp",
    "apscheduler",
]
allow_indirect_imports = true
